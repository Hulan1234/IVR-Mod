pluginManagement {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }
}

// Fabric and Forge use different Gradle versions. They are invoked by the
// root build tasks through their own Wrapper scripts, rather than included as
// composite builds (which would configure both with the root Gradle version).
