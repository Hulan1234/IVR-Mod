allprojects {
    version = project.findProperty('mod_version') ?: '1.2-beta'
    group = project.findProperty('maven_group') ?: 'net.hulan'

    repositories {
        mavenCentral()
        maven { name = 'MavenCentralApache'; url = 'https://repo.maven.apache.org/maven2/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://libraries.minecraft.net/' }
    }
}

subprojects {
    apply plugin: 'java-library'

    dependencies {
        implementation 'com.google.code.gson:gson:2.14.0'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // Architectury Loom 1.13 runs on Java 21, while these Minecraft
        // targets remain Java 17 compatible.
        options.release = 17
    }

    sourceSets {
        main {
            java.srcDirs = ['../../common/main/java', '../src/main/java', 'src/main/java']
            resources.srcDirs = ['../../common/main/resources', '../src/main/resources']
        }
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
        archivesBaseName = "IVR-FORGE-${project.minecraft_version}"
    }
}
