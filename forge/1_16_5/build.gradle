plugins {
    id 'net.minecraftforge.gradle' version '[5.1,6.0)'
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    implementation fg.deobf('me.shedaniel:architectury-forge:1.32.66')
    implementation(files("lib/MTR-forge-1.16.5-3.2.2-hotfix-1.jar"))

    // Common:
    annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
    annotationProcessor 'com.google.guava:guava:32.1.2-jre'
}

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    runs.all { args '-mixin.config=IVR.mixins.json', '-mixin.config=ksd.mixins.json' }
}

