pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'Sponge'; url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
}

def sharedProperties = new Properties()
def sharedPropertiesFile = file('../gradle.properties')
if (sharedPropertiesFile.isFile()) {
    sharedPropertiesFile.withInputStream { sharedProperties.load(it) }
}

gradle.beforeProject { project ->
    sharedProperties.each { key, value ->
        if (!project.hasProperty(key)) {
            project.ext.set(key.toString(), value.toString())
        }
    }
}

dependencyResolutionManagement {
    // Architectury Loom adds its LWJGL repository to each project. Allow that
    // repository to participate in resolution instead of discarding it here.
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        mavenCentral()
        maven { name = 'Forge'; url = 'https://maven.minecraftforge.net/' }
        maven { name = 'Architectury'; url = 'https://maven.architectury.dev/' }
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'MinecraftLibraries'; url = 'https://libraries.minecraft.net/' }
    }
}

rootProject.name = 'forge'
include('1_16_5', '1_17_1', '1_18_2', '1_19_2', '1_19_4')

project(':1_16_5').projectDir = file('1_16_5')
project(':1_17_1').projectDir = file('1_17_1')

project(':1_18_2').projectDir = file('1_18_2')
project(':1_19_2').projectDir = file('1_19_2')
project(':1_19_4').projectDir = file('1_19_4')
